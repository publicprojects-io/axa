[package]
name = "axa-paseto-auth"
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "PASETO bearer authentication and ABAC enforcement for Axum services."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[dependencies]
authentication-verifier = "0.9"
axa-problem-details-for-http-apis = { version = "0.1.0", path = "../axa-problem-details-for-http-apis" }
axum = "0.8"
tracing = "0.1"

[dev-dependencies]
base64 = "0.23"
ed25519-dalek = "3.0"
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }

[lints]
workspace = true
