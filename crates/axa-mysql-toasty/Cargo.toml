[package]
name = "axa-mysql-toasty"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Toasty connections, migrations, and test resets for Axum services, on MySQL."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[dependencies]
sqlx = { version = "0.9", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-ring-webpki"] }
toasty = { version = "0.11", default-features = false, features = ["mysql", "rustls", "migration"] }
toasty-core = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
