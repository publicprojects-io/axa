[package]
name = "axa-diesel"
version = "0.2.1"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Diesel pooling, migrations, and test resets for Axum services, in pure Rust."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[dependencies]
diesel = { version = "2.3", default-features = false, features = ["postgres_backend"] }
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"] }
diesel-async = { version = "0.9", features = ["postgres", "deadpool", "migrations"] }
diesel_migrations = "2.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
