[package]
name = "axa-mssql"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "SQL Server pooling, migrations, and test resets for Axum services, over the pure-Rust mssql driver."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"
keywords = ["axum", "sqlserver", "mssql", "pool", "migrations"]
categories = ["database"]

[dependencies]
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"] }
mssql = { version = "3", default-features = false, features = ["tds73", "rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["net"] }
tokio-util = { version = "0.7", features = ["compat"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
