[package]
name = "axa-keycloak"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Keycloak bearer authentication and ABAC enforcement for Axum services."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
# The tests hold a throwaway signing key, which has no place in a published package.
exclude = ["tests/"]

[dependencies]
axum = "0.8"
# The engine behind Keycloak verification. rustls, so no native-tls or OpenSSL.
axum-keycloak-auth = { version = "0.8.4", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
base64 = "0.23"
# Test tokens only. Keep the major version axum-keycloak-auth uses, so the tests
# mint with the same library that verifies and the tree holds one copy.
jsonwebtoken = "9.3"
time = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }

[lints]
workspace = true
