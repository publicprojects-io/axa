[package]
name = "axa-request-rate-limit"
version = "0.3.3"
edition = "2024"
rust-version.workspace = true
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "In-process request limits, per client or per key, and failed-login lockout for Axum services."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"

[features]
default = []
# A limit shared across replicas, counted in Postgres.
postgres = ["dep:sqlx", "dep:thiserror", "dep:hmac", "dep:sha2"]
# A limit shared across replicas, counted in Redis.
redis = ["dep:redis", "dep:thiserror", "dep:hmac", "dep:sha2"]

[dependencies]
axa-problem = { version = "0.2.0", path = "../axa-problem" }
axum = "0.8"
serde_json = "1"
tracing = "0.1"
# For `shared`, which only the `postgres` and `redis` features build.
thiserror = { version = "2", optional = true }
# HMAC-SHA256, which every build computes alike, for the key a client is counted under.
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"], optional = true }
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "connection-manager", "tls-rustls-webpki-roots"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
