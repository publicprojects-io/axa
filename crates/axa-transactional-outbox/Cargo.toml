[package]
name = "axa-transactional-outbox"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "A transactional outbox and relay on Postgres for Axum services."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[features]
default = []
# `write_seaorm`, for a service whose transactions are SeaORM's.
seaorm = ["dep:sea-orm"]
# Payloads sealed at rest with XChaCha20-Poly1305, with keys the service supplies.
encryption = ["dep:chacha20poly1305", "dep:sha2", "dep:zeroize"]

[dependencies]
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "getrandom", "zeroize"], optional = true }
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"], optional = true }
serde_json = "1"
sha2 = { version = "0.11", features = ["zeroize"], optional = true }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "json", "uuid"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
# Wipes key material when a key is dropped.
zeroize = { version = "1.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
