[package]
name = "axa-keycloak-auth"
version = "0.5.2"
edition = "2024"
rust-version.workspace = true
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Keycloak bearer authentication and ABAC enforcement for Axum services."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
autotests = false
# The tests ship. Their signing key, `tests/idp/test-key.der`, is a throwaway one that
# `authentication-verifier` 0.9.1 already publishes in `src/test_idp.rs`, and signs
# nothing real.

# Integration tests: `tests/main.rs` holds most, as modules, so they link once. Each
# one below it needs a process of its own; see the top of `tests/main.rs`.
[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "audit_log"
path = "tests/audit_log.rs"

[[test]]
name = "tenant_span"
path = "tests/tenant_span.rs"

[dependencies]
axum = "0.8"
# The engine behind Keycloak verification. rustls, so no native-tls or OpenSSL.
axum-keycloak-auth = { version = "0.8.4", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The timer `ReloadablePolicy::watch_file` polls with. Already in the build through
# axum-keycloak-auth.
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"

[dev-dependencies]
base64 = "0.23"
# Test tokens only. Keep the major version axum-keycloak-auth uses, so the tests
# mint with the same library that verifies and the tree holds one copy.
jsonwebtoken = "9.3"
time = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }

[lints]
workspace = true
