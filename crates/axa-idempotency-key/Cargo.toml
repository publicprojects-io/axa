[package]
name = "axa-idempotency-key"
version = "0.2.2"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Idempotency-Key handling over Postgres for Axum services."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[dependencies]
axa-problem = { version = "0.2.0", path = "../axa-problem" }
axum = "0.8"
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1", features = ["macros", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
