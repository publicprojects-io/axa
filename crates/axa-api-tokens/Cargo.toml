[package]
name = "axa-api-tokens"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Opaque API tokens with a prefix, kept only as a SHA-256 hash, with scopes, expiry, and last use."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"
keywords = ["axum", "api", "token", "authentication"]
categories = ["web-programming::http-server", "authentication"]

[dependencies]
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
