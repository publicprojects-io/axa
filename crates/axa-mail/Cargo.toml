[package]
name = "axa-mail"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Mail for Axum services over lettre: SMTP, file, and memory transports, with production refusing SMTP without TLS."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["mail", "smtp", "email", "lettre", "axum"]
categories = ["email"]

[dependencies]
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls-tls", "file-transport"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[lints]
workspace = true
