[package]
name = "axa-http-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "An outbound HTTP client that refuses private, loopback, link-local, and metadata addresses, after DNS and on every redirect."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["ssrf", "http", "client", "reqwest", "security"]
categories = ["web-programming::http-client"]

[dependencies]
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
tokio = { version = "1", features = ["net"] }

[dev-dependencies]
axum = "0.8"
futures-core = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
