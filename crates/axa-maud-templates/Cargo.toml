[package]
name = "axa-maud-templates"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Maud compile-time HTML templates with safe escaping and generic errors for Axum services."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"

[dependencies]
axum = "0.8"
maud = { version = "0.27", default-features = false }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
