[package]
name = "axa-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Web sessions for Axum services over axum_session, with safe defaults."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[features]
default = []
# Sessions in Postgres, encrypted at rest.
postgres = ["dep:axum_session_sqlx", "dep:sqlx"]

[dependencies]
axum_session = "0.22"
axum_session_sqlx = { version = "0.12", default-features = false, features = ["postgres", "tls-rustls"], optional = true }
sqlx = { version = "0.9", default-features = false, features = ["postgres"], optional = true }
thiserror = "2"
time = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
