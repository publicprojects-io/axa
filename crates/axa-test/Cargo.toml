[package]
name = "axa-test"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Request-level test helpers for Axa services, built on axum-test."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[features]
# Mint PASETO tokens under a throwaway test key, for a service on axa-paseto-auth.
paseto = [
    "dep:authentication-verifier",
    "dep:base64",
    "dep:ed25519-dalek",
    "dep:rusty_paseto",
    "dep:serde_json",
    "dep:sha2",
]

[dependencies]
axa = { version = "0.12.0", path = "../.." }
axum-test = "21"
authentication-verifier = { version = "0.9", optional = true }
base64 = { version = "0.23", optional = true }
ed25519-dalek = { version = "3.0", optional = true }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }

[dev-dependencies]
axa-paseto-auth = { path = "../axa-paseto-auth" }
authentication-verifier = "0.9"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
