[package]
name = "axa-test"
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Request-level test helpers for Axa services, built on axum-test."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[features]
# Mint PASETO tokens under a throwaway test key, for a service on axa-paseto-auth.
paseto = [
    "dep:authentication-verifier",
    "dep:base64",
    "dep:ed25519-dalek",
    "dep:rusty_paseto",
    "dep:sha2",
]
# The outbox of a service's memory mailer.
mail = ["axa/mail"]
# Responses checked against the OpenAPI document, status, content type, and schema.
openapi = ["dep:jsonschema"]
# A Postgres database of its own for each test, cloned from a template migrated once.
postgres-sqlx = ["dep:axa-postgres-sqlx", "dep:tokio"]

[dependencies]
axa = { version = "0.17.0", path = "../.." }
axum-test = "21"
authentication-verifier = { version = "0.9", optional = true }
base64 = { version = "0.23", optional = true }
ed25519-dalek = { version = "3.0", optional = true }
# Without its default features, so that it fetches no schema over HTTP or from disk.
jsonschema = { version = "0.61", default-features = false, optional = true }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"], optional = true }
serde_json = "1"
sha2 = { version = "0.11", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }
axa-postgres-sqlx = { version = "0.2.0", path = "../axa-postgres-sqlx", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
axa-paseto-auth = { path = "../axa-paseto-auth" }
authentication-verifier = "0.9"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
