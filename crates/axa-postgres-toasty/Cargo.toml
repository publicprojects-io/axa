[package]
name = "axa-postgres-toasty"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Toasty on PostgreSQL: connections, migrations, and test resets for Axum services."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[dependencies]
toasty = { version = "0.11", default-features = false, features = ["postgresql", "rustls", "migration"] }
toasty-core = "0.11"
tokio-postgres = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
