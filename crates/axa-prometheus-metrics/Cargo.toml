[package]
name = "axa-prometheus-metrics"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Prometheus text exposition for Axum services."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[dependencies]
axum = "0.8"
prometheus = { version = "0.14", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
