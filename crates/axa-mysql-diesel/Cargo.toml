[package]
name = "axa-mysql-diesel"
version = "0.3.1"
edition = "2024"
rust-version.workspace = true
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Diesel pooling, migrations, and test resets for Axum services on MySQL, in pure Rust."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"

[dependencies]
diesel = { version = "2.4", default-features = false, features = ["mysql_backend"] }
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"] }
diesel-async = { version = "0.10", features = ["mysql", "deadpool", "migrations"] }
diesel_migrations = "2.4"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
