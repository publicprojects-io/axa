name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The checks that used to be one job run as these, side by side, so a run takes as long as
  # the slowest of them and not all of them added up: a green run was about 25 minutes, and
  # was under 10 once split. Each job restores its own cache, and saves it only on `main`, so
  # pull requests cannot fill the repository's cache quota. The `check` job at the end is
  # the one result, under the name that was there before. A step that outgrows its job goes
  # in a job of its own: the Postgres suites are three for that reason.
  lint:
    name: lint (format, clippy on both toolchains, docs, dependency checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      # The minimum supported version, over the pin in `rust-toolchain.toml`, which
      # `rustup default` would not override.
      RUSTUP_TOOLCHAIN: "1.98"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      # Clippy differs between versions, so check the minimum supported
      # version and current stable: a lint can pass on one and fail on the other.
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      # The feature sets are not interchangeable: some tests compile only
      # without `sea-orm`, and the worker tests only without `queue` as well.
      - name: Clippy, default features
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy, queue
        run: cargo clippy --all-targets --features queue -- -D warnings
      - name: Clippy, sqlx
        run: cargo clippy --all-targets --features postgres-sqlx -- -D warnings

      - name: Clippy, all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Library code only, where test modules are not built: no `unwrap`, which says
      # nothing of why it cannot fail, as `expect` does; no `dbg!`, `todo!`, or
      # `unimplemented!` left behind; and no `mem::forget`, which leaks.
      - name: Clippy, library code may not unwrap or leak
        run: >-
          cargo clippy --workspace --lib --all-features --
          -D warnings -D clippy::unwrap_used -D clippy::dbg_macro -D clippy::todo
          -D clippy::unimplemented -D clippy::mem_forget

      # RCA-ENF-5. Production code only: tests and examples
      # may use plain operators (RCA-SCOPE-4). The path is given, as `rg` reads stdin without one. The
      # second pattern is the spec's, tightened so that it cannot span statements.
      - name: Checked arithmetic, no saturating, wrapping or overflowing, and no unwrapped checked result
        shell: bash
        run: |
          skip=(-g '!**/tests/**' -g '!examples/**')
          if rg -w --type rust '(saturating|wrapping|overflowing)_\w+' "${skip[@]}" .; then exit 1; fi
          if rg -U --type rust '\.checked_\w+\((?:[^()]|\([^()]*\))*\)\s*\.(unwrap|expect|unwrap_unchecked|unwrap_or_default)\b' "${skip[@]}" .; then exit 1; fi

      - name: Clippy, stable, all features
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings

      - name: Docs
        run: cargo doc --workspace --no-deps --all-features

      - name: No C database client library in the Diesel crates
        run: |
          cargo tree -p axa-postgres-diesel --all-features -e normal > diesel-tree.txt
          cargo tree -p axa-mysql-diesel --all-features -e normal >> diesel-tree.txt
          if grep -E 'pq-sys|libpq|mysqlclient|openssl|native-tls' diesel-tree.txt; then exit 1; fi

      - name: No chrono for a service on Postgres
        run: |
          cargo tree -e normal -p axa --features queue,postgres-sqlx,outbox,idempotency,ratelimit,cursor-pagination,openapi > chrono-tree.txt
          cargo tree -e normal -p axa-postgres-job-queue >> chrono-tree.txt
          if grep -E ' chrono v' chrono-tree.txt; then exit 1; fi

  feature-libs:
    name: each feature alone, as a library without dev-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      # The minimum supported version, over the pin in `rust-toolchain.toml`, which
      # `rustup default` would not override.
      RUSTUP_TOOLCHAIN: "1.98"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each feature alone, building only the library, so no dev-dependency can turn on
      # what a feature forgot to: `--all-targets` above builds the tests too, and their
      # dev-dependencies can hide a missing tokio feature, as one did for `upload`.
      - name: Each feature alone, without dev-dependencies
        run: |
          for feature in $(sed -n '/^\[features\]/,/^\[dependencies\]/p' Cargo.toml | grep -oE '^[a-z][a-z0-9-]* =' | tr -d ' ='); do
            echo "::group::$feature"
            cargo check --lib -p axa --features "$feature"
            echo "::endgroup::"
          done

  feature-clippy:
    name: clippy for each database and each subcrate feature alone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      # The minimum supported version, over the pin in `rust-toolchain.toml`, which
      # `rustup default` would not override.
      RUSTUP_TOOLCHAIN: "1.98"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each database feature alone, as each makes `AppContext::db` its own handle.
      - name: Clippy, each database alone
        run: |
          cargo clippy --all-targets --features postgres-seaorm -- -D warnings
          cargo clippy --all-targets --features postgres-diesel -- -D warnings
          cargo clippy --all-targets --features postgres-toasty -- -D warnings
          cargo clippy --all-targets --features mysql-sqlx -- -D warnings
          cargo clippy --all-targets --features mysql-seaorm -- -D warnings
          cargo clippy --all-targets --features mysql-diesel -- -D warnings
          cargo clippy --all-targets --features mysql-toasty -- -D warnings
          cargo clippy --all-targets --features sqlite-sqlx -- -D warnings
          cargo clippy --all-targets --features sqlite-seaorm -- -D warnings
          cargo clippy --all-targets --features sqlite-diesel -- -D warnings

      # Each subcrate feature alone, read from the manifests so a new one is covered:
      # code behind one feature can lint clean only beside another, as `redis` did
      # beside `postgres` in `axa-request-rate-limit`. Each also builds as a library
      # alone, so no dev-dependency turns on what it forgot to.
      - name: Clippy, each subcrate feature alone
        run: |
          for manifest in crates/*/Cargo.toml; do
            crate=$(basename "$(dirname "$manifest")")
            for feature in $(sed -n '/^\[features\]/,/^\[/p' "$manifest" | grep -oE '^[a-z][a-z0-9_-]* =' | tr -d ' =' | grep -vx default); do
              echo "::group::$crate $feature"
              cargo clippy -p "$crate" --all-targets --features "$feature" -- -D warnings
              cargo check --lib -p "$crate" --features "$feature"
              echo "::endgroup::"
            done
          done

  test:
    name: tests that need no server (default features, queue, sqlx)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      # The minimum supported version, over the pin in `rust-toolchain.toml`, which
      # `rustup default` would not override.
      RUSTUP_TOOLCHAIN: "1.98"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Runs the tests that need no server, across every test binary at once.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest

      # nextest runs no doctests, and not `cli_exit`, which has a custom harness, so those
      # run with `cargo test`. See .config/nextest.toml.
      - name: Test, default features
        run: |
          cargo nextest run --workspace --profile ci
          cargo test --workspace --doc
          cargo test --test cli_exit

      # A release build reads no name as production. The crate has no
      # dependencies, so its release build is quick.
      - name: Test, release build, environment
        run: cargo test --release -p axa-environment

      - name: Test, queue
        run: cargo test --features queue

      - name: Test, sqlx
        run: cargo test --features postgres-sqlx

  test-all-features:
    name: tests that need no server (all features, doctests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      # The minimum supported version, over the pin in `rust-toolchain.toml`, which
      # `rustup default` would not override.
      RUSTUP_TOOLCHAIN: "1.98"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Runs the tests that need no server, across every test binary at once.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest

      - name: Doctests, idempotency and paseto
        run: cargo test --doc --features idempotency,paseto

      - name: Test, all features
        run: |
          cargo nextest run --workspace --all-features --profile ci
          cargo test --workspace --all-features --doc
          cargo test --test cli_exit --all-features

  test-databases:
    name: tests with each other database alone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      # The minimum supported version, over the pin in `rust-toolchain.toml`, which
      # `rustup default` would not override.
      RUSTUP_TOOLCHAIN: "1.98"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each other database alone, as `AppContext::db`: tests built for one database,
      # such as SQLite refusing a statement timeout, run in no other build.
      - name: Test, each other database alone
        run: |
          for feature in postgres-seaorm postgres-diesel postgres-toasty \
            mysql-sqlx mysql-seaorm mysql-diesel mysql-toasty \
            sqlite-sqlx sqlite-seaorm sqlite-diesel; do
            echo "::group::$feature"
            cargo test --features "$feature"
            echo "::endgroup::"
          done

  postgres-job-queue:
    name: Postgres tests, job queue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      # The minimum supported version, over the pin in `rust-toolchain.toml`, which
      # `rustup default` would not override.
      RUSTUP_TOOLCHAIN: "1.98"
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: axa
          POSTGRES_PASSWORD: axa
          POSTGRES_DB: axa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Postgres tests, job queue
        env:
          AXA_TEST_DB_URL: postgres://axa:axa@localhost:5432/axa_test
        run: |
          cargo test -p axa-postgres-job-queue -- --ignored --test-threads=1

  postgres-outbox:
    name: Postgres tests, outbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      # The minimum supported version, over the pin in `rust-toolchain.toml`, which
      # `rustup default` would not override.
      RUSTUP_TOOLCHAIN: "1.98"
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: axa
          POSTGRES_PASSWORD: axa
          POSTGRES_DB: axa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Postgres tests, outbox
        env:
          AXA_TEST_DB_URL: postgres://axa:axa@localhost:5432/axa_test
        run: |
          cargo test --features outbox --test outbox_shutdown -- --ignored
          cargo test -p axa-transactional-outbox --all-features -- --ignored --test-threads=1

  postgres:
    name: Postgres tests, the rest (and shared rate limits with Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      # The minimum supported version, over the pin in `rust-toolchain.toml`, which
      # `rustup default` would not override.
      RUSTUP_TOOLCHAIN: "1.98"
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: axa
          POSTGRES_PASSWORD: axa
          POSTGRES_DB: axa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Postgres tests
        env:
          AXA_TEST_DB_URL: postgres://axa:axa@localhost:5432/axa_test
        run: |
          cargo test --features queue -- --ignored
          cargo test --all-features --test main -- --ignored --test-threads=1 constraint_errors::
          cargo test --features postgres-sqlx --test main -- --ignored row_security::
          cargo test --all-features --test main -- --ignored --test-threads=1 stale_plan::
          cargo test -p axa-test --features postgres-sqlx -- --ignored
          cargo test -p axa-postgres-sqlx -- --ignored --test-threads=1
          cargo test -p axa-postgres-seaorm -- --ignored --test-threads=1
          cargo test -p axa-postgres-diesel -- --ignored --test-threads=1
          cargo test -p axa-postgres-toasty -- --ignored --test-threads=1
          cargo test -p axa-web-session --all-features -- --ignored --test-threads=1
          cargo test -p axa-idempotency-key -- --ignored --test-threads=1
          cargo test --features idempotency --test main -- --ignored --test-threads=1 idempotency::

      - name: Shared rate limits across replicas
        env:
          AXA_TEST_DB_URL: postgres://axa:axa@localhost:5432/axa_test
          AXA_TEST_REDIS_URL: redis://localhost:6379
        run: cargo test -p axa-request-rate-limit --all-features --test shared -- --ignored --test-threads=1

  mysql:
    name: MySQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      # The minimum supported version, over the pin in `rust-toolchain.toml`, which
      # `rustup default` would not override.
      RUSTUP_TOOLCHAIN: "1.98"
    services:
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: axa
          MYSQL_USER: axa
          MYSQL_PASSWORD: axa
          MYSQL_DATABASE: axa_test
        # 3307 on the runner, which has a MySQL of its own installed.
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -uaxa -paxa --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: MySQL tests
        env:
          AXA_TEST_MYSQL_URL: mysql://axa:axa@127.0.0.1:3307/axa_test
        # Binary logging is on, so only SUPER may create the queue's triggers unless
        # this is set. A service's migration runs as such a role instead.
        run: |
          mysql -h127.0.0.1 -P3307 -uroot -paxa -e "SET GLOBAL log_bin_trust_function_creators = 1"
          cargo test -p axa-mysql-job-queue -- --ignored --test-threads=1
          cargo test -p axa-mysql-sqlx -- --ignored --test-threads=1
          cargo test -p axa-mysql-seaorm -- --ignored --test-threads=1
          cargo test -p axa-mysql-diesel -- --ignored --test-threads=1
          cargo test -p axa-mysql-toasty -- --ignored --test-threads=1
          cargo test --all-features --test main -- --ignored --test-threads=1 other_databases::

  redis-s3:
    name: Redis and S3 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      # The minimum supported version, over the pin in `rust-toolchain.toml`, which
      # `rustup default` would not override.
      RUSTUP_TOOLCHAIN: "1.98"
    services:
      redis:
        image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # An S3-compatible endpoint, RustFS 1.0.6, with test credentials and nothing else.
      s3:
        image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
        env:
          RUSTFS_ACCESS_KEY: axatest
          RUSTFS_SECRET_KEY: axatestsecret
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Redis tests
        env:
          AXA_TEST_REDIS_URL: redis://localhost:6379
        run: cargo test -p axa-redis-cache -- --ignored

      # STO-3 and STO-5 against a real endpoint, in a bucket of its own, each run under a
      # unique prefix. The service has no health command, so wait for it to answer.
      - name: S3 tests
        env:
          AXA_TEST_S3_URL: http://axatest:axatestsecret@localhost:9000/axa-test
        run: |
          for _ in $(seq 30); do curl -s -o /dev/null http://localhost:9000/ && break; sleep 2; done
          curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" --user axatest:axatestsecret -X PUT http://localhost:9000/axa-test
          cargo test -p axa-storage-with-apache-arrow-and-aws --test storage -- --ignored

  # A change to a published crate's public API needs a new version first. This compares
  # each crate with its last release on crates.io, and fails where the version is still the
  # published one and the API changed in a way that needs a bump: a removed item, a changed
  # parameter list, a new enum variant without `non_exhaustive`, and the rest of its lints.
  # It cannot see a changed return type, so a `Result` where there was none is the
  # reviewer's to catch. A crate bumped past its release is not checked: the bump is the
  # signal. A crate with no release yet, such as the held SQLite ones, has no baseline, so
  # it is left out here, and a new crate goes in the list until it is published.
  semver:
    name: semver (public API against the last release on crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: "1.98"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-semver-checks

      - name: Subcrates against their last release
        run: |
          cargo semver-checks check-release --workspace --all-features \
            --exclude axa \
            --exclude axa-sqlite-sqlx --exclude axa-sqlite-seaorm --exclude axa-sqlite-diesel

      # The published `axa` has no `sqlite-*` features, as the SQLite crates are held, so
      # they are left out of the feature list. Every other feature is on.
      - name: axa against its last release
        shell: bash
        run: |
          features=$(sed -n '/^\[features\]/,/^\[dependencies\]/p' Cargo.toml | grep -oE '^[a-z][a-z0-9-]* =' | tr -d ' =' | grep -v '^sqlite-' | grep -vx default | paste -sd, -)
          cargo semver-checks check-release -p axa --features "$features"

  # One result for the required-status rule, as the single `check` job was before.
  check:
    name: check
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - feature-libs
      - feature-clippy
      - test
      - test-all-features
      - test-databases
      - postgres-job-queue
      - postgres-outbox
      - postgres
      - mysql
      - redis-s3
      - semver
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  examples:
    name: examples and the service template
    runs-on: ubuntu-latest
    # They are standalone packages outside the workspace, so the main job never builds
    # them, and they drift unless something does.
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # The minimum supported version, over the pin in `rust-toolchain.toml`.
      RUSTUP_TOOLCHAIN: "1.98"
      # One target directory for all of them, so they share the axa build.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-examples
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: axa
          POSTGRES_PASSWORD: axa
          POSTGRES_DB: axa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ". -> target-examples"

      - name: Databases for the examples' own tests
        env:
          PGPASSWORD: axa
        # The multi-tenant test runs as a role row-level security applies to: not a
        # superuser, as axa is.
        run: |
          psql -h localhost -U axa -d axa_test \
            -c "CREATE DATABASE todo_api_test" \
            -c "CREATE ROLE todo_app LOGIN PASSWORD 'todo_app'" \
            -c "CREATE DATABASE multi_tenant_test OWNER todo_app"

      - name: Examples
        run: |
          for example in hello-world basic-service todo-api multi-tenant webhooks file-drop; do
            (cd "examples/$example" && cargo clippy --all-targets -- -D warnings && cargo test)
          done
          (cd examples/todo-api && \
            AXA_TEST_DB_URL=postgres://axa:axa@localhost:5432/todo_api_test cargo test -- --ignored)
          (cd examples/multi-tenant && \
            AXA_TEST_DB_URL=postgres://todo_app:todo_app@localhost:5432/multi_tenant_test \
            cargo test -- --ignored)

      # Built and linted on every push, so they do not rot. Fuzzing runs on nightly, and
      # the database benchmarks need servers, so both run by hand: see CONTRIBUTING.md.
      - name: Fuzz targets and benchmarks build
        run: |
          (cd fuzz && cargo fmt --check && cargo clippy --bins -- -D warnings)
          (cd benchmarks && cargo fmt --check && cargo clippy --benches -- -D warnings)

      - name: Service template, against this repository's axa
        working-directory: templates/service-template
        run: |
          cargo clippy --all-targets --config 'patch.crates-io.axa.path="../.."' -- -D warnings
          cargo test --config 'patch.crates-io.axa.path="../.."'

  coverage:
    name: coverage floor (cargo-tarpaulin, no database servers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-tarpaulin
      # Tarpaulin holds each section of tarpaulin.toml to the floor on its own, and the
      # narrower one, `axa` with no database, measures 54% of lines on 21 November 2026
      # with no server, against 68% for all of them merged and 95% with the database and
      # S3 suites. The floor stops coverage falling; raise it as coverage rises.
      - run: cargo tarpaulin --config tarpaulin.toml --fail-under 52

  mutants:
    name: mutation test of the changed lines (cargo-mutants)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants
      # The branch's own lines only, and none that need a database server.
      - run: bin/mutants-diff "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  supply-chain:
    name: supply chain (advisories, licences, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The runner's own stable, over the pin in `rust-toolchain.toml`.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny --all-features check advisories bans licenses sources

  workflows:
    name: workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: zizmor
      - run: zizmor --offline .github

  secrets:
    name: secret scan (gitleaks, whole history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release binary, checked against its published SHA-256, so the scanner
      # is pinned like the actions.
      - name: install gitleaks 8.30.1
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks
      - run: gitleaks detect --source . --redact --no-banner
