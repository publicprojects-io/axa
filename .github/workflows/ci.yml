name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A green run takes about 8 minutes. A hung test fails here, not after six hours.
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: axa
          POSTGRES_PASSWORD: axa
          POSTGRES_DB: axa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: axa
          MYSQL_USER: axa
          MYSQL_PASSWORD: axa
          MYSQL_DATABASE: axa_test
        # 3307 on the runner, which has a MySQL of its own installed.
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -uaxa -paxa --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97
      # Clippy differs between versions, so check the minimum supported
      # version and current stable: a lint can pass on one and fail on the other.
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      # The feature sets are not interchangeable: some tests compile only
      # without `sea-orm`, and the worker tests only without `queue` as well.
      - name: Clippy, default features
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy, queue
        run: cargo clippy --all-targets --features queue -- -D warnings
      - name: Clippy, sqlx
        run: cargo clippy --all-targets --features postgres-sqlx -- -D warnings
      # Each database feature alone, as each makes `AppContext::db` its own handle.
      - name: Clippy, each database alone
        run: |
          cargo clippy --all-targets --features postgres-seaorm -- -D warnings
          cargo clippy --all-targets --features postgres-diesel -- -D warnings
          cargo clippy --all-targets --features postgres-toasty -- -D warnings
          cargo clippy --all-targets --features mysql-sqlx -- -D warnings
          cargo clippy --all-targets --features mysql-seaorm -- -D warnings
          cargo clippy --all-targets --features mysql-diesel -- -D warnings
          cargo clippy --all-targets --features mysql-toasty -- -D warnings
          cargo clippy --all-targets --features sqlite-sqlx -- -D warnings
          cargo clippy --all-targets --features sqlite-seaorm -- -D warnings
          cargo clippy --all-targets --features sqlite-diesel -- -D warnings
      # Each outbox feature alone, as a service turns it on: code behind one
      # feature can lint clean only beside the other.
      - name: Clippy, outbox features one at a time
        run: |
          cargo clippy -p axa-transactional-outbox --all-targets --features encryption -- -D warnings
          cargo clippy -p axa-transactional-outbox --all-targets --features seaorm -- -D warnings
      - name: Clippy, all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy, stable, all features
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test, default features
        run: cargo test --workspace
      # A release build reads no name as production. The crate has no
      # dependencies, so its release build is quick.
      - name: Test, release build, environment
        run: cargo test --release -p axa-environment
      - name: Test, queue
        run: cargo test --features queue
      - name: Test, sqlx
        run: cargo test --features postgres-sqlx
      - name: Doctests, idempotency and paseto
        run: cargo test --doc --features idempotency,paseto
      - name: Test, all features
        run: cargo test --workspace --all-features

      - name: Docs
        run: cargo doc --workspace --no-deps --all-features

      - name: No C database client library in the Diesel crates
        run: |
          cargo tree -p axa-postgres-diesel --all-features -e normal > diesel-tree.txt
          cargo tree -p axa-mysql-diesel --all-features -e normal >> diesel-tree.txt
          if grep -E 'pq-sys|libpq|mysqlclient|openssl|native-tls' diesel-tree.txt; then exit 1; fi

      - name: Postgres tests
        env:
          AXA_TEST_DB_URL: postgres://axa:axa@localhost:5432/axa_test
        run: |
          cargo test --features queue -- --ignored
          cargo test --all-features --test constraint_errors -- --ignored --test-threads=1
          cargo test --features postgres-sqlx --test row_security -- --ignored
          cargo test --features postgres-sqlx --test stale_plan -- --ignored
          cargo test -p axa-test --features postgres-sqlx -- --ignored
          cargo test --features outbox --test outbox_shutdown -- --ignored
          cargo test -p axa-transactional-outbox --all-features -- --ignored --test-threads=1
          cargo test -p axa-postgres-job-queue -- --ignored --test-threads=1
          cargo test -p axa-postgres-sqlx -- --ignored --test-threads=1
          cargo test -p axa-postgres-seaorm -- --ignored --test-threads=1
          cargo test -p axa-postgres-diesel -- --ignored --test-threads=1
          cargo test -p axa-postgres-toasty -- --ignored --test-threads=1
          cargo test -p axa-web-session --all-features -- --ignored --test-threads=1
          cargo test -p axa-idempotency-key -- --ignored --test-threads=1
          cargo test --features idempotency --test idempotency -- --ignored --test-threads=1

      - name: MySQL tests
        env:
          AXA_TEST_MYSQL_URL: mysql://axa:axa@127.0.0.1:3307/axa_test
        # Binary logging is on, so only SUPER may create the queue's triggers unless
        # this is set. A service's migration runs as such a role instead.
        run: |
          mysql -h127.0.0.1 -P3307 -uroot -paxa -e "SET GLOBAL log_bin_trust_function_creators = 1"
          cargo test -p axa-mysql-job-queue -- --ignored --test-threads=1
          cargo test -p axa-mysql-sqlx -- --ignored --test-threads=1
          cargo test -p axa-mysql-seaorm -- --ignored --test-threads=1
          cargo test -p axa-mysql-diesel -- --ignored --test-threads=1
          cargo test -p axa-mysql-toasty -- --ignored --test-threads=1
          cargo test --all-features --test other_databases -- --ignored --test-threads=1

      - name: Redis tests
        env:
          AXA_TEST_REDIS_URL: redis://localhost:6379
        run: cargo test -p axa-redis-cache -- --ignored

  examples:
    name: examples and the service template
    runs-on: ubuntu-latest
    # They are standalone packages outside the workspace, so the main job never builds
    # them, and they drift unless something does.
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # One target directory for all four, so they share the axa build.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-examples
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: axa
          POSTGRES_PASSWORD: axa
          POSTGRES_DB: axa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97 --profile minimal --component clippy
      - run: rustup default 1.97
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target-examples"

      - name: Databases for the examples' own tests
        env:
          PGPASSWORD: axa
        # The multi-tenant test runs as a role row-level security applies to: not a
        # superuser, as axa is.
        run: |
          psql -h localhost -U axa -d axa_test \
            -c "CREATE DATABASE todo_api_test" \
            -c "CREATE ROLE todo_app LOGIN PASSWORD 'todo_app'" \
            -c "CREATE DATABASE multi_tenant_test OWNER todo_app"

      - name: Examples
        run: |
          for example in basic-service todo-api multi-tenant; do
            (cd "examples/$example" && cargo clippy --all-targets -- -D warnings && cargo test)
          done
          (cd examples/todo-api && \
            AXA_TEST_DB_URL=postgres://axa:axa@localhost:5432/todo_api_test cargo test -- --ignored)
          (cd examples/multi-tenant && \
            AXA_TEST_DB_URL=postgres://todo_app:todo_app@localhost:5432/multi_tenant_test \
            cargo test -- --ignored)

      - name: Service template, against this repository's axa
        working-directory: templates/service-template
        run: |
          cargo clippy --all-targets --config 'patch.crates-io.axa.path="../.."' -- -D warnings
          cargo test --config 'patch.crates-io.axa.path="../.."'

  supply-chain:
    name: supply chain (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny --all-features check advisories bans licenses sources

  workflows:
    name: workflow audit (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: zizmor
      - run: zizmor --offline .github

  secrets:
    name: secret scan (gitleaks, whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release binary, checked against its published SHA-256, so the scanner
      # is pinned like the actions.
      - name: install gitleaks 8.30.1
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks
      - run: gitleaks detect --source . --redact --no-banner
