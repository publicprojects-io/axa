name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: axa
          POSTGRES_PASSWORD: axa
          POSTGRES_DB: axa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97
      # Clippy differs between versions, so check the minimum supported
      # version and current stable: a lint can pass on one and fail on the other.
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      # The feature sets are not interchangeable: some tests compile only
      # without `sea-orm`, and the worker tests only without `queue` as well.
      - name: Clippy, default features
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy, queue and testing
        run: cargo clippy --all-targets --features queue,testing -- -D warnings
      - name: Clippy, sqlx
        run: cargo clippy --all-targets --features sqlx -- -D warnings
      # Each outbox feature alone, as a service turns it on: code behind one
      # feature can lint clean only beside the other.
      - name: Clippy, outbox features one at a time
        run: |
          cargo clippy -p axa-outbox --all-targets --features encryption -- -D warnings
          cargo clippy -p axa-outbox --all-targets --features sea-orm -- -D warnings
      - name: Clippy, all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy, stable, all features
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test, default features
        run: cargo test --workspace
      - name: Test, queue and testing
        run: cargo test --features queue,testing
      - name: Test, sqlx
        run: cargo test --features sqlx
      - name: Test, all features
        run: cargo test --workspace --all-features

      - name: Docs
        run: cargo doc --workspace --no-deps --all-features

      - name: No C database library in axa-diesel
        run: |
          cargo tree -p axa-diesel --all-features -e normal > diesel-tree.txt
          if grep -E 'pq-sys|libpq|openssl' diesel-tree.txt; then exit 1; fi

      - name: Postgres tests
        env:
          AXA_TEST_DATABASE_URL: postgres://axa:axa@localhost:5432/axa_test
        run: |
          cargo test --features queue,testing -- --ignored
          cargo test --all-features --test constraint_errors -- --ignored --test-threads=1
          cargo test --features outbox --test outbox_shutdown -- --ignored
          cargo test -p axa-outbox --all-features -- --ignored --test-threads=1
          cargo test -p axa-worker -- --ignored --test-threads=1
          cargo test -p axa-sqlx -- --ignored --test-threads=1
          cargo test -p axa-seaorm -- --ignored --test-threads=1
          cargo test -p axa-diesel -- --ignored --test-threads=1
          cargo test -p axa-session --all-features -- --ignored --test-threads=1
          cargo test -p axa-idempotency -- --ignored --test-threads=1
          cargo test --features idempotency --test idempotency -- --ignored --test-threads=1

      - name: Redis tests
        env:
          AXA_TEST_REDIS_URL: redis://localhost:6379
        run: cargo test -p axa-redis -- --ignored

  supply-chain:
    name: supply chain (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny --all-features check advisories bans licenses sources

  workflows:
    name: workflow audit (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: zizmor
      - run: zizmor --offline .github

  secrets:
    name: secret scan (gitleaks, whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release binary, checked against its published SHA-256, so the scanner
      # is pinned like the actions.
      - name: install gitleaks 8.30.1
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks
      - run: gitleaks detect --source . --redact --no-banner
