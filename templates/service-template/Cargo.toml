[package]
name = "service-template"
version = "0.1.0"
edition = "2024"
description = "A service built with Axa"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
rust-version = "1.97"
publish = false

[dependencies]
# Turn on what the service needs, such as "postgres-sqlx" for a Postgres pool in
# AppContext::db, "paseto" or "keycloak" for bearer tokens, or "queue" for jobs.
# Each feature is listed in Axa's README.
axa = "0.12"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Standalone, not a member of the axa workspace.
[workspace]
