version: '3.8'

# Development database services for service-template
# Use: podman-compose -f podman-compose.yml up -d

services:
  postgres:
    image: postgres:18-alpine
    container_name: service-template-postgres
    environment:
      POSTGRES_USER: service
      POSTGRES_PASSWORD: service
      POSTGRES_DB: service_dev
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 keeps its data in a versioned directory under this one.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service -d service_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: service-template-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: MySQL
  # Uncomment if you need MySQL
  # mysql:
  #   image: mysql:8.4
  #   container_name: service-template-mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root
  #     MYSQL_USER: service
  #     MYSQL_PASSWORD: service
  #     MYSQL_DATABASE: service_dev
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-U", "service", "-pservice"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  # mysql_data:
