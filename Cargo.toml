[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

[package]
name = "axa"
version = "0.6.1"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Small shared library for services built directly on Axum."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["axum", "sqlx", "web", "service"]
categories = ["web-programming::http-server"]
include = [
    "src/**/*",
    "spec/**/*",
    "help/**/*",
    "skill/**/*",
    "LICENSE.md",
    "README.md",
    "CHANGELOG.md",
    "AGENTS.md",
    "CLAUDE.md",
    "llms.txt",
    "llms.json",
]

[features]
default = []
# A SeaORM-backed `AppContext`, plus `axa-seaorm`.
sea-orm = ["dep:sea-orm", "dep:axa-seaorm", "axa-outbox?/sea-orm"]
# The Postgres job queue, worker pool, and schedules, from `axa-worker`.
queue = ["dep:sqlx", "dep:axa-worker"]
# Test helpers built on `axum-test`, for request-level tests.
testing = ["dep:axum-test"]
# Each of these re-exports a subcrate under the same name.
diesel = ["dep:axa-diesel"]
idempotency = ["dep:axa-idempotency", "dep:sqlx"]
keycloak = ["dep:axa-keycloak"]
openapi = ["dep:axa-openapi"]
opentelemetry = ["dep:axa-opentelemetry"]
# Needs `queue` for what it sits beside: sqlx errors as `axa::Error`, and `server::run`.
outbox = ["dep:axa-outbox", "queue"]
# Signed cursor pages with no total, as `axa::cursor_pagination`.
cursor-pagination = ["dep:axa-cursor-pagination"]
# Offset pages with a total, as `axa::offset_pagination`. Insecure: prefer cursors.
offset-pagination = ["dep:axa-offset-pagination"]
# The old name for `offset-pagination`, kept so that a service naming it still builds,
# with `axa::pagination` as the old path. It will go.
pagination = ["offset-pagination"]
paseto = ["dep:axa-paseto"]
# `axa::error` answers with `axa-problem`, so this adds nothing, and stays so that a
# service naming it still builds.
problem = []
prometheus = ["dep:axa-prometheus"]
ratelimit = ["dep:axa-ratelimit"]
redis = ["dep:axa-redis"]
session = ["dep:axa-session"]
sqlx = ["dep:axa-sqlx", "dep:sqlx"]
tera = ["dep:axa-tera"]
tracing = ["dep:axa-tracing"]
versioning = ["dep:axa-versioning"]

[dependencies]
axa-diesel = { version = "0.2.0", path = "crates/axa-diesel", optional = true }
axa-environment = { version = "0.1.1", path = "crates/axa-environment" }
axa-idempotency = { version = "0.1.0", path = "crates/axa-idempotency", optional = true }
axa-openapi = { version = "0.1.0", path = "crates/axa-openapi", optional = true }
axa-outbox = { version = "0.1.0", path = "crates/axa-outbox", optional = true }
axa-cursor-pagination = { version = "0.1.0", path = "crates/axa-cursor-pagination", optional = true }
axa-offset-pagination = { version = "0.1.0", path = "crates/axa-offset-pagination", optional = true }
axa-keycloak = { version = "0.3.0", path = "crates/axa-keycloak", optional = true }
axa-paseto = { version = "0.5.0", path = "crates/axa-paseto", optional = true }
axa-problem = { version = "0.1.0", path = "crates/axa-problem" }
axa-prometheus = { version = "0.1.0", path = "crates/axa-prometheus", optional = true }
axa-ratelimit = { version = "0.1.0", path = "crates/axa-ratelimit", optional = true }
axa-redis = { version = "0.1.1", path = "crates/axa-redis", optional = true }
axa-seaorm = { version = "0.2.1", path = "crates/axa-seaorm", optional = true }
axa-session = { version = "0.1.0", path = "crates/axa-session", optional = true }
axa-sqlx = { version = "0.1.2", path = "crates/axa-sqlx", optional = true }
axa-tera = { version = "0.2.1", path = "crates/axa-tera", optional = true }
axa-tracing = { version = "0.1.0", path = "crates/axa-tracing", optional = true }
axa-opentelemetry = { version = "0.1.1", path = "crates/axa-opentelemetry", optional = true }
axa-versioning = { version = "0.2.0", path = "crates/axa-versioning", optional = true }
axa-worker = { version = "0.1.0", path = "crates/axa-worker", optional = true }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
clap = { version = "4", features = ["derive"] }
# Direct only so that `server` can limit reading headers, which `axum::serve` cannot.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "service", "tokio"] }
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["catch-panic", "compression-full", "cors", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

axum-test = { version = "21", optional = true }
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"], optional = true }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "json", "uuid", "chrono"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
