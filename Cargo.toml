[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

[package]
name = "axa"
version = "0.13.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Accessories library for Axum websites, databases, microservices, and more."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["axum", "sqlx", "web", "service"]
categories = ["web-programming::http-server"]
include = [
    "build.rs",
    "src/**/*",
    "spec/**/*",
    "help/**/*",
    "skill/**/*",
    "LICENSE.md",
    "README.md",
    "CHANGELOG.md",
    "AGENTS.md",
    "CLAUDE.md",
    "llms.txt",
    "llms.json",
]

[features]
default = []
# Each database feature, named for its database and library, re-exports its crate under
# the same name, adds `axa::model` and `axa::validation`, and makes `AppContext::db` its
# handle. With more than one on, Postgres wins, then MySQL, then SQLite, and for each,
# sqlx, then SeaORM, Diesel, and Toasty.
#
# A SeaORM feature turns on sqlx as well, which SeaORM builds anyway, so that its
# errors are read as sqlx's are.
postgres-sqlx = ["dep:axa-postgres-sqlx", "dep:sqlx", "sqlx/postgres", "model"]
postgres-seaorm = ["dep:sea-orm", "sea-orm/sqlx-postgres", "dep:axa-postgres-seaorm", "axa-transactional-outbox?/seaorm", "dep:sqlx", "sqlx/postgres", "model"]
postgres-diesel = ["dep:axa-postgres-diesel", "model"]
postgres-toasty = ["dep:axa-postgres-toasty", "model"]
mysql-sqlx = ["dep:axa-mysql-sqlx", "dep:sqlx", "sqlx/mysql", "model"]
mysql-seaorm = ["dep:sea-orm", "sea-orm/sqlx-mysql", "dep:axa-mysql-seaorm", "dep:sqlx", "sqlx/mysql", "model"]
mysql-diesel = ["dep:axa-mysql-diesel", "model"]
mysql-toasty = ["dep:axa-mysql-toasty", "model"]
# The SQLite features build `libsqlite3-sys` 0.37, which has RUSTSEC-2026-0459, so
# their crates are not published until sqlx raises its cap on it.
sqlite-sqlx = ["dep:axa-sqlite-sqlx", "dep:sqlx", "sqlx/sqlite", "model"]
sqlite-seaorm = ["dep:sea-orm", "sea-orm/sqlx-sqlite", "dep:axa-sqlite-seaorm", "dep:sqlx", "sqlx/sqlite", "model"]
sqlite-diesel = ["dep:axa-sqlite-diesel", "model"]
# Model errors and validation, for every database. Each database feature turns it on.
model = ["dep:validator"]
# The Postgres job queue, worker pool, and schedules, from `axa-postgres-job-queue`.
queue = ["dep:sqlx", "sqlx/postgres", "dep:axa-postgres-job-queue"]
# Each of these re-exports a subcrate under the same name.
idempotency = ["dep:axa-idempotency-key", "dep:sqlx", "sqlx/postgres"]
keycloak = ["dep:axa-keycloak-auth"]
openapi = ["dep:axa-openapi-docs"]
opentelemetry = ["dep:axa-opentelemetry"]
# Needs `queue` for what it sits beside: sqlx errors as `axa::Error`, and `server::run`.
outbox = ["dep:axa-transactional-outbox", "queue"]
# Outbox payloads sealed at rest, as `axa::outbox::Writer::sealing`.
outbox-encryption = ["outbox", "axa-transactional-outbox/encryption"]
# Signed cursor pages with no total, as `axa::cursor_pagination`.
cursor-pagination = ["dep:axa-cursor-pagination"]
# An outbound HTTP client that refuses private addresses, as `axa::http_client`.
http-client = ["dep:axa-http-client"]
# Standard Webhooks signing and verifying, as `axa::webhooks`.
webhooks = ["dep:axa-webhooks"]
paseto = ["dep:axa-paseto-auth"]
# `axa::error` answers with `axa-problem`, so this adds
# nothing, and stays so that a service naming it still builds.
problem = []
prometheus = ["dep:axa-prometheus-metrics"]
ratelimit = ["dep:axa-request-rate-limit"]
redis = ["dep:axa-redis-cache"]
session = ["dep:axa-web-session"]
tera = ["dep:axa-tera-templates"]
maud = ["dep:axa-maud-templates"]
tracing = ["dep:axa-tracing"]
versioning = ["dep:axa-accepts-version-negotiation"]
# Bounded multipart uploads, files spooled to temporary files, as `axa::upload`.
upload = ["dep:tempfile", "tokio/fs"]

[dependencies]
axa-postgres-diesel = { version = "0.3.0", path = "crates/axa-postgres-diesel", optional = true }
axa-environment = { version = "0.2.0", path = "crates/axa-environment" }
axa-idempotency-key = { version = "0.2.2", path = "crates/axa-idempotency-key", optional = true }
axa-openapi-docs = { version = "0.1.0", path = "crates/axa-openapi-docs", optional = true }
axa-transactional-outbox = { version = "0.3.0", path = "crates/axa-transactional-outbox", optional = true }
axa-cursor-pagination = { version = "0.1.1", path = "crates/axa-cursor-pagination", optional = true }
axa-webhooks = { version = "0.1.0", path = "crates/axa-webhooks", optional = true }
axa-http-client = { version = "0.1.0", path = "crates/axa-http-client", optional = true }
axa-keycloak-auth = { version = "0.5.0", path = "crates/axa-keycloak-auth", optional = true }
axa-paseto-auth = { version = "0.7.0", path = "crates/axa-paseto-auth", optional = true }
axa-problem = { version = "0.2.0", path = "crates/axa-problem" }
axa-prometheus-metrics = { version = "0.1.1", path = "crates/axa-prometheus-metrics", optional = true }
axa-request-rate-limit = { version = "0.3.0", path = "crates/axa-request-rate-limit", optional = true }
axa-redis-cache = { version = "0.2.0", path = "crates/axa-redis-cache", optional = true }
axa-postgres-seaorm = { version = "0.4.0", path = "crates/axa-postgres-seaorm", optional = true }
axa-web-session = { version = "0.1.0", path = "crates/axa-web-session", optional = true }
axa-postgres-sqlx = { version = "0.2.0", path = "crates/axa-postgres-sqlx", optional = true }
axa-tera-templates = { version = "0.2.1", path = "crates/axa-tera-templates", optional = true }
axa-maud-templates = { version = "0.1.0", path = "crates/axa-maud-templates", optional = true }
axa-postgres-toasty = { version = "0.2.0", path = "crates/axa-postgres-toasty", optional = true }
axa-mysql-sqlx = { version = "0.1.0", path = "crates/axa-mysql-sqlx", optional = true }
axa-mysql-seaorm = { version = "0.1.0", path = "crates/axa-mysql-seaorm", optional = true }
axa-mysql-diesel = { version = "0.1.0", path = "crates/axa-mysql-diesel", optional = true }
axa-mysql-toasty = { version = "0.1.0", path = "crates/axa-mysql-toasty", optional = true }
axa-sqlite-sqlx = { version = "0.1.0", path = "crates/axa-sqlite-sqlx", optional = true }
axa-sqlite-seaorm = { version = "0.1.0", path = "crates/axa-sqlite-seaorm", optional = true }
axa-sqlite-diesel = { version = "0.1.0", path = "crates/axa-sqlite-diesel", optional = true }
axa-tracing = { version = "0.1.0", path = "crates/axa-tracing", optional = true }
axa-opentelemetry = { version = "0.1.1", path = "crates/axa-opentelemetry", optional = true }
axa-accepts-version-negotiation = { version = "0.2.1", path = "crates/axa-accepts-version-negotiation", optional = true }
axa-postgres-job-queue = { version = "0.2.0", path = "crates/axa-postgres-job-queue", optional = true }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
clap = { version = "4", features = ["derive"] }
# Direct only so that `server` can limit reading headers, which `axum::serve` cannot.
# Direct only so that the body limit binds a body a handler reads itself, with the error
# `axum` answers as `413`. Already in every build, through `axum` and `hyper`.
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "service", "tokio"] }
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["catch-panic", "compression-full", "cors", "decompression-full", "sensitive-headers", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
validator = { version = "0.21", optional = true }

sea-orm = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls"], optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "json", "uuid", "chrono"], optional = true }

[dev-dependencies]
validator = { version = "0.21", features = ["derive"] }
# `html!` names the `maud` crate, so the `maud` feature's test depends on it as a service does.
maud = { version = "0.27", default-features = false }
tokio = { version = "1", features = ["io-util", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
