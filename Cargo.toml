[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

[package]
name = "axa"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Small shared library for services built directly on Axum and sqlx."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["axum", "sqlx", "web", "service"]
categories = ["web-programming::http-server"]
include = [
    "src/**/*",
    "spec/**/*",
    "help/**/*",
    "LICENSE.md",
    "README.md",
    "CHANGELOG.md",
    "AGENTS.md",
    "CLAUDE.md",
]

[features]
default = []
# A SeaORM-backed `AppContext`, plus `axa-seaorm`.
sea-orm = ["dep:sea-orm", "dep:axa-seaorm"]
# The Postgres job queue (`FOR UPDATE SKIP LOCKED`).
queue = ["dep:sqlx"]
# Test helpers built on `axum-test`, for request-level tests.
testing = ["dep:axum-test"]
# Each of these re-exports a subcrate under the same name.
openapi = ["dep:axa-openapi"]
pagination = ["dep:axa-pagination"]
paseto = ["dep:axa-paseto"]
problem = ["dep:axa-problem"]
prometheus = ["dep:axa-prometheus"]
redis = ["dep:axa-redis"]
sqlx = ["dep:axa-sqlx"]
versioning = ["dep:axa-versioning"]

[dependencies]
axa-openapi = { version = "0.1.0", path = "crates/axa-openapi", optional = true }
axa-pagination = { version = "0.1.0", path = "crates/axa-pagination", optional = true }
axa-paseto = { version = "0.1.0", path = "crates/axa-paseto", optional = true }
axa-problem = { version = "0.1.0", path = "crates/axa-problem", optional = true }
axa-prometheus = { version = "0.1.0", path = "crates/axa-prometheus", optional = true }
axa-redis = { version = "0.1.0", path = "crates/axa-redis", optional = true }
axa-seaorm = { version = "0.1.0", path = "crates/axa-seaorm", optional = true }
axa-sqlx = { version = "0.1.0", path = "crates/axa-sqlx", optional = true }
axa-versioning = { version = "0.1.0", path = "crates/axa-versioning", optional = true }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
clap = { version = "4", features = ["derive"] }
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-full", "cors", "set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

axum-test = { version = "21", optional = true }
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"], optional = true }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "json", "uuid", "chrono"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
