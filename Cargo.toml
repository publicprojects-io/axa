[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

[package]
name = "axa"
version = "0.10.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Small shared library for services built directly on Axum."
readme = "README.md"
repository = "https://github.com/publicprojects-io/axa/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["axum", "sqlx", "web", "service"]
categories = ["web-programming::http-server"]
include = [
    "src/**/*",
    "spec/**/*",
    "help/**/*",
    "skill/**/*",
    "LICENSE.md",
    "README.md",
    "CHANGELOG.md",
    "AGENTS.md",
    "CLAUDE.md",
    "llms.txt",
    "llms.json",
]

[features]
default = []
# A SeaORM-backed `AppContext`, plus `axa-seaorm`.
sea-orm = ["dep:sea-orm", "dep:axa-seaorm", "axa-transactional-outbox?/sea-orm"]
# The Postgres job queue, worker pool, and schedules, from `axa-postgres-job-queue`.
queue = ["dep:sqlx", "dep:axa-postgres-job-queue"]
# Each of these re-exports a subcrate under the same name.
diesel = ["dep:axa-diesel"]
idempotency = ["dep:axa-idempotency-key", "dep:sqlx"]
keycloak = ["dep:axa-keycloak-auth"]
openapi = ["dep:axa-openapi-docs"]
opentelemetry = ["dep:axa-opentelemetry"]
# Needs `queue` for what it sits beside: sqlx errors as `axa::Error`, and `server::run`.
outbox = ["dep:axa-transactional-outbox", "queue"]
# Outbox payloads sealed at rest, as `axa::outbox::Writer::sealing`.
outbox-encryption = ["outbox", "axa-transactional-outbox/encryption"]
# Signed cursor pages with no total, as `axa::cursor_pagination`.
cursor-pagination = ["dep:axa-cursor-pagination"]
paseto = ["dep:axa-paseto-auth"]
# `axa::error` answers with `axa-problem-details-for-http-apis`, so this adds
# nothing, and stays so that a service naming it still builds.
problem = []
prometheus = ["dep:axa-prometheus-metrics"]
ratelimit = ["dep:axa-request-rate-limit"]
redis = ["dep:axa-redis-cache"]
session = ["dep:axa-web-session"]
sqlx = ["dep:axa-sqlx", "dep:sqlx"]
tera = ["dep:axa-tera-templates"]
tracing = ["dep:axa-tracing"]
versioning = ["dep:axa-accepts-version-negotiation"]

[dependencies]
axa-diesel = { version = "0.2.0", path = "crates/axa-diesel", optional = true }
axa-environment = { version = "0.1.1", path = "crates/axa-environment" }
axa-idempotency-key = { version = "0.2.1", path = "crates/axa-idempotency-key", optional = true }
axa-openapi-docs = { version = "0.1.0", path = "crates/axa-openapi-docs", optional = true }
axa-transactional-outbox = { version = "0.2.0", path = "crates/axa-transactional-outbox", optional = true }
axa-cursor-pagination = { version = "0.1.1", path = "crates/axa-cursor-pagination", optional = true }
axa-keycloak-auth = { version = "0.3.0", path = "crates/axa-keycloak-auth", optional = true }
axa-paseto-auth = { version = "0.5.0", path = "crates/axa-paseto-auth", optional = true }
axa-problem-details-for-http-apis = { version = "0.1.0", path = "crates/axa-problem-details-for-http-apis" }
axa-prometheus-metrics = { version = "0.1.0", path = "crates/axa-prometheus-metrics", optional = true }
axa-request-rate-limit = { version = "0.2.0", path = "crates/axa-request-rate-limit", optional = true }
axa-redis-cache = { version = "0.1.1", path = "crates/axa-redis-cache", optional = true }
axa-seaorm = { version = "0.2.1", path = "crates/axa-seaorm", optional = true }
axa-web-session = { version = "0.1.0", path = "crates/axa-web-session", optional = true }
axa-sqlx = { version = "0.1.2", path = "crates/axa-sqlx", optional = true }
axa-tera-templates = { version = "0.2.1", path = "crates/axa-tera-templates", optional = true }
axa-tracing = { version = "0.1.0", path = "crates/axa-tracing", optional = true }
axa-opentelemetry = { version = "0.1.1", path = "crates/axa-opentelemetry", optional = true }
axa-accepts-version-negotiation = { version = "0.2.0", path = "crates/axa-accepts-version-negotiation", optional = true }
axa-postgres-job-queue = { version = "0.2.0", path = "crates/axa-postgres-job-queue", optional = true }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
clap = { version = "4", features = ["derive"] }
# Direct only so that `server` can limit reading headers, which `axum::serve` cannot.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "service", "tokio"] }
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["catch-panic", "compression-full", "cors", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

sea-orm = { version = "2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"], optional = true }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "json", "uuid", "chrono"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
