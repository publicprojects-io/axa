# gitleaks's own rules, and the values they mistake for secrets.
[extend]
useDefault = true

[allowlist]
description = "Public test values: Standard Webhooks' published test-vector secret, and axa-request-rate-limit's expected HMAC of a key under the test secret [7; 32]. Neither signs anything real"
regexes = [
    '''^whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw$''',
    '''01754edd21ab0860ceee492554db4491''',
]
