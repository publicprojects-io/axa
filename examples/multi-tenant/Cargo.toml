[package]
name = "multi-tenant"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
axa = { path = "../..", features = ["postgres-sqlx", "paseto"] }
# The verifier and policy types the guard is built from, which axa-paseto-auth uses.
authentication-verifier = "0.9"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# Signs PASETO tokens under a throwaway key, as the auth service would.
axa-test = { path = "../../crates/axa-test", features = ["paseto"] }
tower = { version = "0.5", features = ["util"] }

# Standalone, not a member of the axa workspace.
[workspace]
