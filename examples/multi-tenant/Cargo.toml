[package]
name = "multi-tenant"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
axa = { path = "../..", features = ["postgres-sqlx", "paseto"] }
# The verifier and policy types the guard is built from, which axa-paseto-auth uses.
authentication-verifier = "0.9"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# To mint PASETO tokens in tests, as the auth service would.
base64 = "0.23"
ed25519-dalek = "3.0"
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
sha2 = "0.11"
tower = { version = "0.5", features = ["util"] }

# Standalone, not a member of the axa workspace.
[workspace]
