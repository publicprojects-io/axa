[package]
name = "basic-service"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Axum for the web framework
axum = "0.8"

# axa for shared infrastructure
axa = { path = "../../", version = "0.12" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Environment variables
dotenvy = "0.15"

# Logging
 tracing = "0.1"
 tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# HTTP client for tests
hyper = "1.0"
tower = { version = "0.4", features = ["util"] }
