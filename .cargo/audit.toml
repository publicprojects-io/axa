# cargo-audit settings. CI runs `cargo audit`, which scans every package in
# Cargo.lock, built or not, and `cargo deny check advisories`, which scans only
# what the enabled features build.

[advisories]
ignore = [
    # libsqlite3-sys 0.37 (C SQLite). It is in Cargo.lock only because sqlx lists
    # SQLite as an optional driver, and nothing in axa builds it: `cargo tree -i
    # libsqlite3-sys --all-features --target all` prints nothing, and `cargo deny`,
    # which would catch it if it were ever built, passes. sqlx-sqlite 0.9.0 caps it
    # below 0.38, and the fix is in 0.39. sqlx raised the cap in
    # https://github.com/transact-rs/sqlx/pull/4502, merged 2026-11-08 and not yet
    # released. Once it is, run `cargo update -p libsqlite3-sys` and remove this.
    "RUSTSEC-2026-0459",
]
