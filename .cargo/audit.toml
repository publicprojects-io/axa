# cargo-audit settings. CI runs `cargo audit`, which scans every package in
# Cargo.lock, built or not, and `cargo deny check advisories`, which scans only
# what the enabled features build.

[advisories]
ignore = [
    # libsqlite3-sys 0.37 (C SQLite 3.53), CVE-2026-119375: a crafted database and
    # `-wal` file pair can make queries return uninitialized memory. It is local, and
    # needs files a less trusted party wrote. `axa` itself does not build it, and
    # `cargo deny`, which checks what `axa`'s features build, passes. Only the SQLite
    # crates build it: `axa-sqlite-job-queue`, `axa-sqlite-sqlx`, `axa-sqlite-seaorm`,
    # and `axa-sqlite-diesel`, and `axa`'s `sqlite-*` features through them. They open
    # files the service names itself, and are not published until this is fixed. sqlx-sqlite 0.9.0 caps it
    # below 0.38, and the fix is in 0.39. One crate may link `sqlite3`, so nothing
    # else in the workspace can use a fixed copy. sqlx raised the cap in
    # https://github.com/transact-rs/sqlx/pull/4502, merged 2026-11-08 and not yet
    # released. Once it is, run `cargo update -p libsqlite3-sys`, remove this, and
    # `axa-sqlite-job-queue` may be published.
    "RUSTSEC-2026-0459",
]
