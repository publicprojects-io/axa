# cargo-deny policy: advisories, licences, banned crates, and where code may come
# from. CI runs `cargo deny check`.

[advisories]
version = 2
ignore = [
    # rustls-pemfile 2.2.0 is unmaintained, not vulnerable: its repository was
    # archived in August 2025, and its code lives on in rustls-pki-types. Only
    # toasty-driver-postgresql 0.11 brings it in, for Postgres TLS, through the
    # `postgres-toasty` feature. Remove this once Toasty no longer depends on it.
    { id = "RUSTSEC-2025-0134", reason = "unmaintained, not vulnerable; only via toasty-driver-postgresql" },
    # libsqlite3-sys 0.37 (C SQLite 3.53), CVE-2026-119375: a crafted database and `-wal`
    # file pair can make queries return uninitialized memory. It is local, and needs
    # files a less trusted party wrote. Only the `sqlite-*` features build it, through the
    # SQLite crates, which open files the service names itself and are not published
    # until this is fixed. sqlx 0.9.0 caps it below 0.38, and one crate may link
    # `sqlite3`, so nothing in the workspace can use the fix in 0.39. sqlx raised its cap
    # in https://github.com/transact-rs/sqlx/pull/4502, merged 2026-11-08, not yet
    # released. Once it is, run `cargo update -p libsqlite3-sys` and remove this, and the
    # same in `.cargo/audit.toml`.
    { id = "RUSTSEC-2026-0459", reason = "local only, SQLite crates unpublished; remove once sqlx releases its raised cap" },
]

[licenses]
version = 2
# Permissive licences only for dependencies. This crate's own licence is an OR
# expression, satisfied by any one allowed term.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
# The subcrates are path dependencies of a published crate, which cargo-deny
# reports as wildcards.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
