# Test coverage with cargo-tarpaulin: `make coverage`, or `cargo tarpaulin`.
#
# The llvm engine works on macOS and Linux alike. The report covers the tests that need
# no server; with AXA_TEST_DB_URL and the others set, `cargo tarpaulin -- --ignored`
# adds the database tests, as CI runs them.
[coverage]
engine = "Llvm"
workspace = true
all-features = true
skip-clean = true
timeout = "300s"
no-fail-fast = true
# The two shutdown tests start their own binary again as a server and wait for it to say
# it is ready, which the instrumented binary does not in time. `cargo test` runs them.
args = ["--skip", "lets_a_request_in_flight_finish_and_exits_cleanly"]
out = ["Html", "Json", "Lcov", "Stdout"]
output-dir = "docs/coverage" # Typically "target/coverage"
# Test helpers and generated code, not the library under test.
exclude-files = ["crates/*/tests/*", "tests/*", "examples/*", "templates/*"]